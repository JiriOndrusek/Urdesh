
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timer Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="panel">
    <div id="timeContainer">
      <span id="time">20:00</span>
      <input id="timeInput" type="text" class="hidden" />
    </div>

    <!-- Button 1: green -> red (one-shot) -->
    <img id="button1" src="green.png" class="btn">
    <img id="button1Clicked1" src="orange.png" class="btn hidden">
    <img id="button1Clicked2" src="red.png" class="btn hidden">


    <!-- Button 2: blue <-> red -->
    <img id="button2" src="blue.png" class="btn">
    <img id="button2Toggled" src="red.png" class="btn hidden">

    <!-- Button 3: red <-> blue -->
    <img id="button3" src="red.png" class="btn">
    <img id="button3Toggled" src="blue.png" class="btn hidden">


    <!-- Defense Batteries Panel -->
      <div class="counter-panel" id="counterA">
        <div class="counter-value" id="counterAValue">0</div>
        <button id="counterAPlus">+</button>
        <button id="counterAMinus">−</button>
      </div>

      <div class="counter-panel" id="counterB">
        <div class="counter-value" id="counterBValue">0</div>
        <button id="counterBPlus">+</button>
        <button id="counterBMinus">−</button>
      </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
